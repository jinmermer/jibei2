name: 冀北公告每日推送

on:
  schedule:
    # GitHub 使用 UTC 时间；UTC 00:00 = 北京时间 08:00
    - cron: '0 0 * * *'
  workflow_dispatch:      # 支持在网页上手动点一下立即运行

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖与浏览器
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 抓取并推送钉钉
        env:
          DING_WEBHOOK: ${{ secrets.DING_WEBHOOK }}
          DING_SECRET: ${{ secrets.DING_SECRET }}
          DING_ONLY_WHEN_NEW: '0'
        run: python jb_notices.py

      - name: 保存去重库（避免重复推送）
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jb_notices.json || true
          git commit -m "update store $(date -u +%F)" || echo "无变化"
          git push || echo "推送失败但不影响结果"

      - name: 失败时通知钉钉
        if: failure()
        env:
          DING_WEBHOOK: ${{ secrets.DING_WEBHOOK }}
          DING_SECRET: ${{ secrets.DING_SECRET }}
        run: |
          python - <<'PY'
          import os, time, hmac, hashlib, base64, urllib.parse, requests, urllib3
          urllib3.disable_warnings()
          wh = os.environ.get("DING_WEBHOOK", ""); sec = os.environ.get("DING_SECRET", "")
          if not wh:
              raise SystemExit("缺少 webhook")
          ts = str(round(time.time() * 1000))
          sign = urllib.parse.quote_plus(base64.b64encode(
              hmac.new(sec.encode(), f"{ts}\n{sec}".encode(), hashlib.sha256).digest()))
          text = ("### 冀北公告推送 · 本次失败\n\n"
                  f"时间：{time.strftime('%F %H:%M')}\n\n"
                  "云端运行出错，请到 GitHub 仓库的 Actions 页面查看红色那次的日志，"
                  "并把日志发给助手。")
          r = requests.post(f"{wh}&timestamp={ts}&sign={sign}",
                            json={"msgtype": "markdown",
                                  "markdown": {"title": "冀北公告推送失败", "text": text}},
                            verify=False, timeout=30)
          print(r.text)
          PY
